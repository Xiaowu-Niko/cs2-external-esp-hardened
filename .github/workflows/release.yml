name: Build & Release

# Builds the x64 Release binary on GitHub's Windows runner and attaches it to a
# GitHub Release. This is the only way to produce a binary from this fork: the
# externals (imgui/json/AsyncLogger/curl) are not vendored, so they are cloned
# in a step below instead of being tracked as submodules.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: release
        type: choice
        options:
          - release
          - pre-release
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The fork dropped the four broken submodule gitlinks, so fetch the
      # externals explicitly. Pinned to the exact commits upstream referenced:
      # imgui in particular MUST be pinned — the code uses ImGuiCol_TabActive /
      # ImGuiCol_TabUnfocused and the multi-viewport API, which were renamed and
      # moved in later imgui releases. Cloning imgui HEAD breaks the build.
      - name: Fetch externals
        shell: bash
        run: |
          set -e
          fetch_pinned() {
            local name="$1" url="$2" sha="$3"
            rm -rf "src/external/$name"
            git init -q "src/external/$name"
            git -C "src/external/$name" remote add origin "$url"
            git -C "src/external/$name" fetch -q --depth 1 origin "$sha"
            git -C "src/external/$name" checkout -q FETCH_HEAD
            rm -rf "src/external/$name/.git"
          }
          fetch_pinned imgui      https://github.com/ocornut/imgui      1d942eb6c9ef0b68cd1515df083d06da651b0d61
          fetch_pinned json       https://github.com/nlohmann/json      af524ab666359f09a16bca1a41543a9a3a941251
          fetch_pinned AsyncLogger https://github.com/Yimura/AsyncLogger 25b5ed31b33c40fabc6b80213c330a10cccf3b49
          fetch_pinned curl       https://github.com/curl/curl          217f0e4d59717fa2a9fd428a4e7458dde26e6e94
          echo "--- layout check ---"
          ls src/external/imgui/imgui.h
          grep '#define IMGUI_VERSION ' src/external/imgui/imgui.h
          ls src/external/json/include/nlohmann/json.hpp
          ls src/external/AsyncLogger/include/AsyncLogger/Logger.hpp
          ls src/external/curl/include/curl/curl.h

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Build solution
        run: msbuild cs2-external-esp.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Locate binary
        id: locate
        shell: bash
        run: |
          set -e
          echo "--- x64 tree ---"
          find x64 -maxdepth 3 -type f \( -name '*.exe' -o -name '*.dll' \) -print 2>/dev/null || true
          EXE=$(find x64 -type f -name 'cs2-external-esp.exe' | head -n 1)
          if [ -z "$EXE" ]; then
            echo "::error::Build produced no cs2-external-esp.exe"
            exit 1
          fi
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "found: $EXE"

      - name: Assemble release payload
        shell: bash
        run: |
          set -e
          mkdir -p release
          cp "${{ steps.locate.outputs.exe }}" release/
          cp README.md release/
          cp LICENSE release/
          # AUDIT report is the reason this fork exists; ship it alongside.
          cp "AUDIT-隐蔽性加固.md" release/ || true
          ls -la release

      - name: Archive artifacts
        shell: bash
        run: |
          cd release
          powershell -Command "Compress-Archive -Path * -DestinationPath ../release.zip -Force"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs2-external-esp-hardened-x64
          path: release.zip
          if-no-files-found: error

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          RUN_ID="${{ github.run_id }}"
          PREV=$(git describe --tags --abbrev=0 --exclude="$TAG" 2>/dev/null || echo "")

          {
            echo "# $TAG"
            echo ""
            echo "由 [构建工作流](https://github.com/$REPO_OWNER/$REPO_NAME/actions/runs/$RUN_ID) 自动生成。"
            echo ""
            echo "> ⚠️ 这是自动构建产物。建议按 README 自行编译，以便核对代码与二进制一致。"
            echo ""
            echo "## 内容"
            echo ""
            echo "- \`cs2-external-esp.exe\` — x64 Release"
            echo "- \`README.md\` / \`LICENSE\`"
            echo "- \`AUDIT-隐蔽性加固.md\` — 加固说明与 \`file:line\` 证据"
            echo ""
            echo "## 使用前提"
            echo ""
            echo "- 游戏必须是**全屏窗口化**"
            echo "- 需要 [VC++ 运行库](https://aka.ms/vc14/vc_redist.x64.exe)（x64）"
            echo "- 仅限单人 / 离线 / 私服。本分支不承诺不被封，详见 README。"
            echo ""
            echo "## 变更"
            echo ""
            if [ -n "$PREV" ]; then
              git log "$PREV..HEAD" --pretty=format:"- %h: %s"
            else
              git log --pretty=format:"- %h: %s" -n 20
            fi
            echo ""
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: CHANGELOG.md
          files: release.zip
          prerelease: ${{ inputs.release_type == 'pre-release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
